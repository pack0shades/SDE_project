[project]
name = "regcheck"
version = "0.1.0"
description = "Multi-agent RAG compliance checking of software requirements (Das et al., TOSEM 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm",
    "sentence-transformers",
    "faiss-cpu",
    "pydantic>=2",
    "pypdf",
    "streamlit",
]

[dependency-groups]
dev = ["pytest", "ruff"]
eval = ["ragas"]
web = ["ddgs"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
